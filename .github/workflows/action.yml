
name: Git-Final 

on:
  push: 
    branches: 
      - main 
  workflow_dispatch: 

jobs: 
  job-1:
    runs-on: ubuntu-latest 
    steps: 
      - name: Print Hello, OS version, and Commit SHA
        run: | 
          echo "Hello"
          cat /etc/os-release
          echo "Commit SHA: ${{ github.sha }}" 

  job-2: 
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4 

      - name: Print all files content
        run: cat * 

      - name: Run test script 
        run: bash test.sh           

  job-3: 
    runs-on: ubuntu-latest 
    steps:
      - name: Print personal details
        env: 
          First_name: "Avi" 
        run: | 
          Last_name="Almiyhu"
          
          echo "First Name: $First_name"
          echo "Last Name: $Last_name"
          echo "Phone Number: ${{ secrets.PHONE_NUMBER }}"